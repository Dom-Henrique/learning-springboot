<!DOCTYPE html>
<html lang="en-gb">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rocker Paper Scissors Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>
    <h1>Rocker Paper Scissors Game</h1>
    <div class="options">
        <div class="movements">
            <p id="you">You:</p>
            <p id="cpu">CPU:</p>
        </div>
        <label for="">Choose your move:</label>
        <button type="submit" value="rock" class="rock" onclick="playGame(value)"><i class="fa-solid fa-hand-back-fist"></i></button>
        <button type="submit" value="paper" class="paper" onclick="playGame(value)"><i class="fa-solid fa-hand"></i></button>
        <button type="submit" value="scissor" class="scissor" onclick="playGame(value)"><i class="fa-solid fa-hand-scissors"></i></button>
    </div>
    <div class="score">
        <p class="myScore">Your Score: 0</p>
        <p class="cpuScore">CPU Score: 0</p>
    </div>
    <script src="main.js"></script>
</body>

</html>
